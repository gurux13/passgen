<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>genpw prompt harness</title>
  <link rel="stylesheet" href="../ui/common.css">
  <link rel="stylesheet" href="../prompt/prompt.css">
  <script>
    // Harness for prompt/prompt.js outside the extension: stubs the extension API
    // and serves genpw.cc's generator files from the local py/static.
    // Serve the repo root over HTTP and open /extension/tests/prompt.html#0123456789abcdef0123456789abcdef
    //   ?tampered  serves a modified crypto.js (hash mismatch)
    //   ?offline   makes every download fail
    //   ?broken    makes the sandbox frame fail to load
    window.__fills = [];
    const params = new URLSearchParams(location.search);
    const realFetch = window.fetch.bind(window);
    window.fetch = async (url, opts) => {
      const m = String(url).match(/^https:\/\/(genpw\.cc|passgen\.ddns\.net)\/(.*)$/);
      if (!m) return realFetch(url, opts);
      if (params.has("offline")) throw new TypeError("Failed to fetch");
      const r = await realFetch(new URL("../../py/" + m[2], location.href).href, opts);
      if (params.has("tampered") && m[2].endsWith("crypto.js")) {
        return new Response((await r.text()) + "\n// tampered\n");
      }
      return r;
    };
    window.chrome = {
      runtime: {
        getURL: (path) => new URL(params.has("broken") ? "../does-not-exist.html" : "../" + path, location.href).href,
        sendMessage: async (msg) => {
          if (msg.type === "genpw:getPrompt") {
            return {
              ok: true,
              origin: "https://login.example.com",
              lastHash: null,
              resources: [{
                id: 1, name: "example.com", url: "https://example.com", last_account_id: 2,
                length: 12, letters: true, digits: true, symbols: true, underscore: true,
                accounts: [
                  { id: 1, pass_part: null, human_readable: null, revision: "0", last_hash: null },
                  { id: 2, pass_part: null, human_readable: "me@example.com", revision: "0", last_hash: null },
                ],
              }],
            };
          }
          if (msg.type === "genpw:fill") {
            window.__fills.push(msg);
            return { ok: true };
          }
          return { ok: true };
        },
      },
    };
  </script>
</head>
<body style="width:340px;height:290px;border:1px solid #444">
  <header>
    <span class="logo">genpw.cc</span>
    <span id="site" class="muted"></span>
    <span id="status" class="status" title="Checking genpw.cc code">…</span>
    <button id="close" class="icon" title="Close (Esc)">✕</button>
  </header>

  <div id="untrusted" hidden>
    <button id="use-anyway">Use anyway</button>
  </div>

  <form id="form" autocomplete="off" hidden>
    <label for="account">Account</label>
    <select id="account"></select>

    <label for="master">Master password</label>
    <input type="password" id="master" autocomplete="off" spellcheck="false">

    <div id="message" class="small" hidden></div>

    <button type="submit" id="fill" class="primary">Fill</button>
  </form>

  <div id="error" class="small bad" hidden></div>

  <script type="module" src="../prompt/prompt.js"></script>
</body>
</html>
